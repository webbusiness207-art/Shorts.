name: Daily Shorts

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg blender fonts-dejavu-core espeak-ng
          blender --version
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade Pillow soundfile faster-whisper requests huggingface_hub piper-tts
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download Piper voice model
        run: |
          mkdir -p models
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import shutil

          files = [
              "en/en_US/lessac/medium/en_US-lessac-medium.onnx",
              "en/en_US/lessac/medium/en_US-lessac-medium.onnx.json",
          ]
          Path("models").mkdir(exist_ok=True)
          for filename in files:
              downloaded = hf_hub_download(
                  repo_id="rhasspy/piper-voices",
                  filename=filename,
                  repo_type="model",
              )
              destination = Path("models") / Path(filename).name
              shutil.copy2(downloaded, destination)
              print(f"Downloaded {destination}")
          PY

      - name: Make videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NICHE: ${{ vars.NICHE }}
          VIDEOS_PER_RUN: ${{ vars.VIDEOS_PER_RUN }}
          PIPER_BIN: piper
          VISUALS: blender
          VOICE: en_US-lessac-medium
        run: python -u pipeline.py

      - name: Save topic history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add -A used_topics.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update topic history" && git push)

      - name: Keep videos and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/
          retention-days: 14
