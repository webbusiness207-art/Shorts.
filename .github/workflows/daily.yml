name: Daily Shorts

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download caption font
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/Poppins-Bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf || echo "Font download failed, using fallback font"

      - name: Make videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEOS_PER_RUN: ${{ vars.VIDEOS_PER_RUN }}
          DEMO: ${{ vars.DEMO }}
          VOICE: ${{ vars.VOICE }}
        run: python -u pipeline.py

      - name: Save topic history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add used_topics.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update topic history" && git pull --rebase && git push)

      - name: Keep videos and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/
          retention-days: 14

