
name: Daily Shorts

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng curl xz-utils
          blender_version="4.1.1"
          curl -fL "https://download.blender.org/release/Blender4.1/blender-${blender_version}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C "$HOME"
          echo "$HOME/blender-${blender_version}-linux-x64" >> "$GITHUB_PATH"
          echo "Blender installed:"
          "$HOME/blender-${blender_version}-linux-x64/blender" --version
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade Pillow soundfile faster-whisper requests
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "kokoro>=0.9.4"

      - name: Download Piper fallback voice
        run: |
          mkdir -p models
          curl -fsSL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz
          curl -fsSL -o models/en_US-lessac-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
          curl -fsSL -o models/en_US-lessac-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"

      - name: Make videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NICHE: ${{ vars.NICHE }}
          VIDEOS_PER_RUN: ${{ vars.VIDEOS_PER_RUN }}
          PIPER_BIN: ${{ github.workspace }}/piper/piper
          VISUALS: blender
          VOICE: am_fenrir
          VOICE_SPEED: "1.10"
          REQUIRE_KOKORO: "1"
        run: python pipeline.py

      - name: Save topic history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add -A used_topics.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update topic history" && git push)

      - name: Keep videos and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/
          retention-days: 14
